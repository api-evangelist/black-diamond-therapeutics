name: Black Diamond Therapeutics

description: 'Black Diamond Therapeutics is a biotechnology company focused on developing precision oncology therapies using its proprietary platform that designs and optimizes small-molecule drugs. The firm leverages advanced computational chemistry and structural biology to target cancer-driving mutations, aiming to bring innovative treatments to patients. Backed by NEA and other investors, Black Diamond Therapeutics is building a pipeline of candidates across multiple tumor types and is actively expanding its research collaborations and clinical programs.'

